<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles | Professional</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --main: #1a1a1a; --accent: #ff6b00; --bg: #f4f7f6; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: #000; overflow-x: hidden; transition: background 0.5s; }

        /* --- THE GATE (Tap Anywhere for Music) --- */
        #birthday-gate { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            cursor: pointer; padding: 20px;
        }
        .gate-card { background: var(--white); padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; box-shadow: 0 0 30px rgba(255,107,0,0.3); }
        .tap-msg { color: var(--accent); font-weight: 800; animation: blink 1.5s infinite; margin-top: 15px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- THE PROFESSIONAL INVOICE --- */
        #app-portal { display: none; background: var(--bg); min-height: 100vh; padding-bottom: 120px; }
        #invoice-container { 
            background: var(--white); width: 100%; max-width: 800px; margin: 0 auto; 
            position: relative; overflow: visible;
        }
        
        /* Wavy Professional Header */
        .bill-header { 
            background: var(--main); color: var(--white); padding: 50px 30px 80px; 
            clip-path: polygon(0 0, 100% 0, 100% 80%, 0% 100%);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .brand-info h1 { margin: 0; font-size: 26px; letter-spacing: 1px; color: var(--accent); }
        .brand-info p { margin: 5px 0 0; opacity: 0.8; font-size: 13px; }

        .invoice-body { padding: 40px 30px; margin-top: -30px; }
        .client-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .input-box { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; }
        input { 
            padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; 
            background: #fdfdfd; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(255,107,0,0.1); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; background: #f9f9f9; font-size: 12px; border-bottom: 2px solid #eee; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; }
        
        .totals-area { margin-top: 40px; width: 280px; margin-left: auto; border-top: 2px solid var(--main); padding-top: 20px; }
        .sum-row { display: flex; justify-content: space-between; padding: 8px 0; font-weight: 700; font-size: 15px; }
        .grand-total { font-size: 26px; color: var(--accent); margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }

        #sig-zone { border: 2px dashed #ccc; border-radius: 12px; height: 140px; margin-top: 10px; background: #fafafa; touch-action: none; }
        
        /* Floating Action Buttons */
        .action-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 450px; display: flex; flex-direction: column; gap: 10px; 
        }
        .btn { 
            padding: 18px; border: none; border-radius: 15px; font-weight: 800; 
            font-size: 16px; cursor: pointer; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }
        .btn-download { background: var(--main); color: #fff; }
        .btn-whatsapp { background: #25d366; color: #fff; }
    </style>
</head>
<body onclick="startMusic()">

<audio id="bday-track" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
</audio>

<div id="birthday-gate">
    <div class="gate-card">
        <h2 style="margin:0;">NAVEED TEXTILES</h2>
        <div style="font-size: 40px; margin: 20px 0;">🎂</div>
        <p><b>Happy Birthday Naveed!</b></p>
        <p style="font-size: 13px; color: #666;">A special gift for a professional legend.</p>
        <div class="tap-msg">TAP ANYWHERE TO ENTER</div>
    </div>
</div>

<div id="app-portal">
    <div id="invoice-container">
        <div class="bill-header">
            <div class="brand-info">
                <h1>NAVEED TEXTILES</h1>
                <p>Premium Fabrics • Professional Tailoring</p>
                <p>Ph: 9906403030</p>
            </div>
            <div style="text-align: right;">
                <div style="background: var(--accent); color: #000; padding: 5px 15px; border-radius: 5px; font-weight: 900; font-size: 12px;">INVOICE</div>
                <p style="margin: 10px 0 0; font-size: 14px;" id="today-date"></p>
                <small>#NT-2026</small>
            </div>
        </div>

        <div class="invoice-body">
            <div class="client-section">
                <div class="input-box"><label>Bill To</label><input id="c-name" placeholder="Customer Name"></div>
                <div class="input-box"><label>Contact</label><input id="c-phone" placeholder="Phone Number"></div>
            </div>
            <div class="input-box" style="margin-bottom: 30px;"><label>Address</label><input id="c-addr" placeholder="Customer Address"></div>

            <table id="items-table">
                <thead>
                    <tr><th>DESCRIPTION</th><th width="60">QTY</th><th width="100">RATE</th><th width="100" style="text-align:right">TOTAL</th></tr>
                </thead>
                <tbody id="bill-rows">
                    <tr>
                        <td><input placeholder="Suit / Fabric Details..." class="item-desc" style="background:none; border:none; padding:5px;"></td>
                        <td><input type="number" value="1" class="item-qty" oninput="updateBill()"></td>
                        <td><input type="number" value="0" class="item-rate" oninput="updateBill()"></td>
                        <td style="text-align:right; font-weight:800;" class="item-total">0</td>
                    </tr>
                </tbody>
            </table>
            <button onclick="addRow()" style="margin-top:15px; background:none; border:1px solid #ddd; padding:8px 15px; border-radius:5px; font-weight:700; color:var(--accent); cursor:pointer;">+ ADD NEW ITEM</button>

            <div class="totals-area">
                <div class="sum-row"><span>Sub-Total</span><span id="sub-total">0</span></div>
                <div class="sum-row" style="color: #d00000;"><span>Discount (%)</span><input id="disc-per" type="number" value="0" oninput="updateBill()" style="width:70px; text-align:right; font-weight:800; border:none; background:none; padding:0;"></div>
                <div class="sum-row"><span>Paid Amount</span><input id="paid-amt" type="number" value="0" oninput="updateBill()" style="width:90px; text-align:right; font-weight:800; border:none; background:none; padding:0;"></div>
                <div class="sum-row grand-total"><span>Balance Due</span><span id="balance-val">0</span></div>
            </div>

            <div style="margin-top:50px;">
                <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                    <label>AUTHORIZED SIGNATURE</label>
                    <span onclick="clearSig()" style="color:red; font-size:10px; font-weight:900; cursor:pointer;">[ CLEAR ]</span>
                </div>
                <canvas id="sig-zone"></canvas>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-download" onclick="exportPDF()">DOWNLOAD PROFESSIONAL PDF</button>
        <button class="btn btn-whatsapp" onclick="exportPDF()">SHARE VIA WHATSAPP</button>
    </div>
</div>

<script>
    // 1. Music Expiry Logic (Vaild only for 2 days)
    const BIRTHDAY_START = new Date("2026-01-18").getTime();
    const TWO_DAYS_MS = 2 * 24 * 60 * 60 * 1000;
    const isBirthdayActive = (Date.now() - BIRTHDAY_START) < TWO_DAYS_MS;

    const music = document.getElementById('bday-track');
    let hasStarted = false;

    function startMusic() {
        if (!hasStarted) {
            if (isBirthdayActive) {
                music.play().catch(e => console.log("Music blocked by browser"));
            }
            document.getElementById('birthday-gate').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('birthday-gate').style.display = 'none';
                document.getElementById('app-portal').style.display = 'block';
                initSig();
            }, 500);
            hasStarted = true;
        }
    }

    // 2. Billing Setup
    document.getElementById('today-date').innerText = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});

    function updateBill() {
        let sub = 0;
        document.querySelectorAll('#bill-rows tr').forEach(row => {
            const q = row.querySelector('.item-qty').value || 0;
            const r = row.querySelector('.item-rate').value || 0;
            const t = q * r;
            row.querySelector('.item-total').innerText = t.toLocaleString();
            sub += t;
        });
        const disc = document.getElementById('disc-per').value || 0;
        const paid = document.getElementById('paid-amt').value || 0;
        const totalAfterDisc = sub - (sub * disc / 100);
        document.getElementById('sub-total').innerText = sub.toLocaleString();
        document.getElementById('balance-val').innerText = (totalAfterDisc - paid).toLocaleString();
    }

    function addRow() {
        const tbody = document.getElementById('bill-rows');
        const tr = tbody.insertRow();
        tr.innerHTML = `<td><input placeholder="Item detail..." class="item-desc" style="background:none; border:none; padding:5px;"></td><td><input type="number" value="1" class="item-qty" oninput="updateBill()"></td><td><input type="number" value="0" class="item-rate" oninput="updateBill()"></td><td style="text-align:right; font-weight:800;" class="item-total">0</td>`;
    }

    // 3. Signature Setup
    let sCan, sCtx, drawing = false;
    function initSig() {
        sCan = document.getElementById('sig-zone');
        sCtx = sCan.getContext('2d');
        sCan.width = sCan.offsetWidth; sCan.height = 140;
        sCtx.lineWidth = 2.5; sCtx.lineCap = 'round'; sCtx.strokeStyle = '#000';
        const getXY = (e) => {
            const rect = sCan.getBoundingClientRect();
            return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
        };
        sCan.addEventListener('touchstart', (e) => { drawing = true; const p = getXY(e); sCtx.beginPath(); sCtx.moveTo(p.x, p.y); e.preventDefault(); });
        sCan.addEventListener('touchmove', (e) => { if(!drawing) return; const p = getXY(e); sCtx.lineTo(p.x, p.y); sCtx.stroke(); e.preventDefault(); });
        window.addEventListener('touchend', () => drawing = false);
    }
    function clearSig() { sCtx.clearRect(0, 0, sCan.width, sCan.height); }

    // 4. THE FULL PDF FIX (Auto-Scroll & Full Capture)
    async function exportPDF() {
        // Sync values to attributes so html2canvas can read them
        document.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
        
        const invoice = document.getElementById('invoice-container');
        
        // Force scroll to top so capture doesn't start halfway
        window.scrollTo(0,0);
        
        const canvas = await html2canvas(invoice, {
            scale: 2,
            useCORS: true,
            scrollY: -window.scrollY,
            height: invoice.scrollHeight,
            windowHeight: invoice.scrollHeight
        });

        const imgData = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`NaveedTextiles_Invoice.pdf`);
    }
</script>
</body>
</html>
