<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles | Professional</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --main: #1a1a1a; --accent: #ff6b00; --bg: #f4f7f6; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: #000; overflow-x: hidden; transition: background 0.5s; }

        /* --- THE GATE --- */
        #birthday-gate { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            cursor: pointer; padding: 20px;
        }
        .gate-card { background: var(--white); padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; box-shadow: 0 0 30px rgba(255,107,0,0.3); }
        .tap-msg { color: var(--accent); font-weight: 800; animation: blink 1.5s infinite; margin-top: 15px; }
        .status-lines { font-size: 14px; text-align: left; margin: 15px auto; display: inline-block; line-height: 1.8; color: #333; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- THE PROFESSIONAL INVOICE --- */
        #app-portal { display: none; background: var(--bg); min-height: 100vh; padding-bottom: 150px; }
        #invoice-container { 
            background: var(--white); width: 100%; max-width: 800px; margin: 0 auto; 
            position: relative;
        }
        
        .bill-header { 
            background: var(--main); color: var(--white); padding: 50px 30px 80px; 
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .brand-info h1 { margin: 0; font-size: 26px; letter-spacing: 1px; color: var(--accent); }
        .brand-info p { margin: 5px 0 0; opacity: 0.8; font-size: 13px; }

        .invoice-body { padding: 40px 30px; margin-top: -30px; }
        .client-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .input-box { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; }
        input { 
            padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; 
            background: #fdfdfd; outline: none; width: 100%;
        }
        input:focus { border-color: var(--accent); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; background: #f9f9f9; font-size: 12px; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        .totals-area { margin-top: 40px; width: 100%; max-width: 300px; margin-left: auto; border-top: 2px solid var(--main); padding-top: 20px; }
        .sum-row { display: flex; justify-content: space-between; padding: 8px 0; font-weight: 700; font-size: 15px; }
        .grand-total { font-size: 24px; color: var(--accent); margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }

        #sig-zone { 
            border: 2px dashed #ccc; border-radius: 12px; height: 120px; width: 100%; 
            background: #fafafa; touch-action: none; cursor: crosshair;
            display: block; /* Ensure it's visible */
        }
        
        .action-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9);
            padding: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000;
            backdrop-filter: blur(10px); border-top: 1px solid #ddd;
        }
        .btn { padding: 15px; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; }
        .btn-download { background: var(--main); color: #fff; }
        .btn-whatsapp { background: #25d366; color: #fff; }
        
        /* Print-specific styles */
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
            #app-portal { display: block !important; padding-bottom: 0; }
            .action-bar { display: none; }
            input { border: none !important; background: transparent !important; }
            #sig-zone { border: 1px solid #000; }
        }
        
        /* For HTML2Canvas rendering */
        .print-mode .no-print { display: none; }
        .print-mode input { border: none !important; background: transparent !important; }
    </style>
</head>
<body>

<audio id="bday-track" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
</audio>

<div id="birthday-gate">
    <div class="gate-card">
        <h2 style="margin:0;">NAVEED TEXTILES</h2>
        <div style="font-size: 40px; margin: 15px 0;">🎂</div>
        <p><b>Happy Birthday Naveed!</b></p>
        <div class="status-lines">
            ⭐ Same Attitude ✔<br>
            ⭐ Same Grind ✔<br>
            ⭐ Bigger Wins Loading... 📈
        </div>
        <div class="tap-msg">TAP TO START THE GRIND</div>
    </div>
</div>

<div id="app-portal">
    <div id="invoice-container">
        <div class="bill-header">
            <div class="brand-info">
                <h1>NAVEED TEXTILES</h1>
                <p>Premium Fabrics • Professional Tailoring</p>
                <p>Ph: 9906403030</p>
            </div>
            <div style="text-align: right;">
                <div style="background: var(--accent); color: #000; padding: 5px 12px; border-radius: 5px; font-weight: 900; font-size: 12px;">INVOICE</div>
                <p style="margin: 10px 0 0; font-size: 14px;" id="today-date"></p>
                <small>#NT-<span id="invoice-number"></span></small>
            </div>
        </div>

        <div class="invoice-body">
            <div class="client-section">
                <div class="input-box"><label>Bill To</label><input id="c-name" placeholder="Customer Name" value=""></div>
                <div class="input-box"><label>Contact</label><input id="c-phone" placeholder="Phone Number" value=""></div>
            </div>
            <div class="input-box" style="margin-bottom: 30px;"><label>Address</label><input id="c-addr" placeholder="Customer Address" value=""></div>

            <table id="items-table">
                <thead>
                    <tr><th>DESCRIPTION</th><th width="60">QTY</th><th width="80">RATE</th><th width="90" style="text-align:right">TOTAL</th></tr>
                </thead>
                <tbody id="bill-rows">
                    <tr>
                        <td><input placeholder="Item..." class="item-desc" style="border:none; padding:5px; background:transparent;" value=""></td>
                        <td><input type="number" value="1" class="item-qty" oninput="updateBill()"></td>
                        <td><input type="number" value="0" class="item-rate" oninput="updateBill()"></td>
                        <td style="text-align:right; font-weight:800;" class="item-total">0</td>
                    </tr>
                </tbody>
            </table>
            
            <button class="no-print" onclick="addRow()" style="margin-top:15px; background:none; border:1px solid #ddd; padding:8px 15px; border-radius:5px; font-weight:700; color:var(--accent); cursor:pointer;">+ ADD ITEM</button>

            <div class="totals-area">
                <div class="sum-row"><span>Sub-Total</span><span id="sub-total">0</span></div>
                <div class="sum-row" style="color: #d00000;">
                    <span>Discount %</span>
                    <input id="disc-per" type="number" value="0" oninput="updateBill()" style="width:50px; text-align:right; border:none; background:none; padding:0; font-weight:bold;">
                </div>
                <div class="sum-row">
                    <span>Paid</span>
                    <input id="paid-amt" type="number" value="0" oninput="updateBill()" style="width:80px; text-align:right; border:none; background:none; padding:0; font-weight:bold;">
                </div>
                <div class="sum-row grand-total"><span>Balance</span><span id="balance-val">0</span></div>
            </div>

            <div style="margin-top:40px;">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 5px;">
                    <label>AUTHORIZED SIGNATURE</label>
                    <span class="no-print" onclick="clearSig()" style="color:red; font-size:10px; font-weight:900; cursor:pointer;">[ CLEAR ]</span>
                </div>
                <canvas id="sig-zone"></canvas>
                <input type="hidden" id="sig-data">
            </div>
        </div>
    </div>

    <div class="action-bar no-print">
        <button class="btn btn-download" onclick="exportPDF()">DOWNLOAD PDF</button>
        <button class="btn btn-whatsapp" onclick="exportPDF(true)">SHARE ON WHATSAPP</button>
    </div>
</div>

<script>
    // Initialize variables
    const music = document.getElementById('bday-track');
    let hasStarted = false;
    let sCan, sCtx, drawing = false;
    let lastX = 0;
    let lastY = 0;
    
    // Set today's date and invoice number
    document.getElementById('today-date').innerText = new Date().toLocaleDateString('en-GB', {
        day: '2-digit', 
        month: 'long', 
        year: 'numeric'
    });
    
    // Generate invoice number (YYYYMMDD-XXXX)
    const now = new Date();
    const invoiceNum = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}-${Math.floor(Math.random()*1000).toString().padStart(4,'0')}`;
    document.getElementById('invoice-number').innerText = invoiceNum;
    
    // Start function with music fix
    function startMusic() {
        if (!hasStarted) {
            // Play music with user interaction
            music.volume = 0.5;
            music.play().then(() => {
                console.log("Music started playing");
            }).catch(error => {
                console.log("Music play failed:", error);
                // Continue anyway even if music fails
            });
            
            document.getElementById('birthday-gate').style.display = 'none';
            document.getElementById('app-portal').style.display = 'block';
            initSig(); // Initialize signature pad
            updateBill(); // Initial calculation
            hasStarted = true;
            
            // Add click event listener to body for music start (first click)
            document.body.removeEventListener('click', startMusic);
        }
    }
    
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
        // Add click listener to gate and body
        document.getElementById('birthday-gate').addEventListener('click', startMusic);
        document.body.addEventListener('click', startMusic);
    });

    function updateBill() {
        let sub = 0;
        document.querySelectorAll('#bill-rows tr').forEach(row => {
            const q = parseFloat(row.querySelector('.item-qty').value) || 0;
            const r = parseFloat(row.querySelector('.item-rate').value) || 0;
            const t = q * r;
            row.querySelector('.item-total').innerText = t.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            sub += t;
        });
        
        const disc = parseFloat(document.getElementById('disc-per').value) || 0;
        const paid = parseFloat(document.getElementById('paid-amt').value) || 0;
        const totalAfterDisc = sub - (sub * disc / 100);
        
        document.getElementById('sub-total').innerText = sub.toLocaleString('en-IN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
        
        document.getElementById('balance-val').innerText = (totalAfterDisc - paid).toLocaleString('en-IN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function addRow() {
        const tbody = document.getElementById('bill-rows');
        const tr = tbody.insertRow();
        tr.innerHTML = `
            <td><input placeholder="Item..." class="item-desc" style="border:none; padding:5px; background:transparent;" value=""></td>
            <td><input type="number" value="1" class="item-qty" oninput="updateBill()"></td>
            <td><input type="number" value="0" class="item-rate" oninput="updateBill()"></td>
            <td style="text-align:right; font-weight:800;" class="item-total">0</td>
        `;
    }

    function initSig() {
        sCan = document.getElementById('sig-zone');
        sCtx = sCan.getContext('2d');
        
        // Set canvas size correctly
        sCan.width = sCan.offsetWidth;
        sCan.height = 120;
        
        sCtx.lineWidth = 2;
        sCtx.lineCap = 'round';
        sCtx.lineJoin = 'round';
        sCtx.strokeStyle = '#000';
        sCtx.fillStyle = '#fafafa';
        sCtx.fillRect(0, 0, sCan.width, sCan.height);
        
        // Get position function
        const getPos = (e) => {
            const rect = sCan.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        };
        
        // Start drawing
        const startDraw = (e) => {
            drawing = true;
            const pos = getPos(e);
            [lastX, lastY] = [pos.x, pos.y];
            sCtx.beginPath();
            sCtx.moveTo(lastX, lastY);
        };
        
        // Draw
        const draw = (e) => {
            if (!drawing) return;
            e.preventDefault();
            
            const pos = getPos(e);
            sCtx.lineTo(pos.x, pos.y);
            sCtx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
        };
        
        // Stop drawing
        const stopDraw = () => {
            drawing = false;
            // Save signature data
            saveSigData();
        };
        
        // Save signature as data URL
        const saveSigData = () => {
            document.getElementById('sig-data').value = sCan.toDataURL();
        };
        
        // Event listeners for mouse
        sCan.addEventListener('mousedown', startDraw);
        sCan.addEventListener('mousemove', draw);
        sCan.addEventListener('mouseup', stopDraw);
        sCan.addEventListener('mouseout', stopDraw);
        
        // Event listeners for touch
        sCan.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDraw(e);
        });
        sCan.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        });
        sCan.addEventListener('touchend', stopDraw);
    }

    function clearSig() {
        sCtx.clearRect(0, 0, sCan.width, sCan.height);
        sCtx.fillStyle = '#fafafa';
        sCtx.fillRect(0, 0, sCan.width, sCan.height);
        document.getElementById('sig-data').value = '';
    }

    async function exportPDF(isWhatsapp = false) {
        // Show loading state
        const downloadBtn = document.querySelector('.btn-download');
        const originalText = downloadBtn.textContent;
        downloadBtn.textContent = 'Generating PDF...';
        downloadBtn.disabled = true;
        
        // Store original styles
        const originalDisplay = [];
        const noPrintElements = document.querySelectorAll('.no-print');
        noPrintElements.forEach(el => {
            originalDisplay.push(el.style.display);
            el.style.display = 'none';
        });
        
        // Force input values to be visible
        document.querySelectorAll('input').forEach(input => {
            if (input.type !== 'hidden') {
                const value = input.value;
                // Create a span with the value for html2canvas to capture
                const span = document.createElement('span');
                span.textContent = value;
                span.style.position = 'absolute';
                span.style.left = '-9999px';
                document.body.appendChild(span);
                
                // Temporarily replace input with text
                const parent = input.parentNode;
                const textSpan = document.createElement('span');
                textSpan.textContent = value || input.placeholder;
                textSpan.style.display = 'inline-block';
                textSpan.style.width = '100%';
                textSpan.style.padding = '12px';
                textSpan.style.minHeight = '20px';
                parent.replaceChild(textSpan, input);
                
                // Store reference to restore later
                input._replacement = textSpan;
                input._parent = parent;
            }
        });
        
        try {
            const invoice = document.getElementById('invoice-container');
            
            // Use html2canvas with better settings
            const canvas = await html2canvas(invoice, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                allowTaint: true,
                foreignObjectRendering: false,
                onclone: function(clonedDoc) {
                    // Ensure signature is visible in clone
                    const sigCanvas = clonedDoc.getElementById('sig-zone');
                    if (sigCanvas) {
                        const ctx = sigCanvas.getContext('2d');
                        ctx.fillStyle = '#fafafa';
                        ctx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
                        // Redraw signature
                        const sigData = document.getElementById('sig-data').value;
                        if (sigData) {
                            const img = new Image();
                            img.src = sigData;
                            ctx.drawImage(img, 0, 0);
                        }
                    }
                }
            });
            
            // Calculate PDF dimensions
            const imgWidth = 210; // A4 width in mm
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            
            // Create PDF
            const pdf = new jspdf.jsPDF({
                orientation: imgHeight > 297 ? 'portrait' : 'portrait',
                unit: 'mm',
                format: 'a4'
            });
            
            // Add image to PDF
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);
            
            // Generate filename
            const customerName = document.getElementById('c-name').value.replace(/\s+/g, '_') || 'Invoice';
            const filename = `NaveedTextiles_${customerName}_${invoiceNum}.pdf`;
            
            if (isWhatsapp) {
                // For WhatsApp sharing (simplified approach)
                pdf.save(filename);
                alert(`PDF downloaded as ${filename}. You can now share it on WhatsApp.`);
            } else {
                // Direct download
                pdf.save(filename);
            }
            
        } catch (error) {
            console.error('PDF generation error:', error);
            alert('Error generating PDF. Please try again.');
        } finally {
            // Restore original state
            downloadBtn.textContent = originalText;
            downloadBtn.disabled = false;
            
            // Restore input elements
            document.querySelectorAll('input').forEach(input => {
                if (input._replacement && input._parent) {
                    input._parent.replaceChild(input, input._replacement);
                }
            });
            
            // Remove temporary spans
            document.querySelectorAll('span[style*="absolute"]').forEach(span => {
                if (span.style.left === '-9999px') {
                    span.remove();
                }
            });
            
            // Restore display of no-print elements
            noPrintElements.forEach((el, index) => {
                el.style.display = originalDisplay[index];
            });
        }
    }
</script>
</body>
</html>
