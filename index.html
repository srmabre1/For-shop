<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles - Final Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --primary: #0052cc; --gold: #ffd700; --bg: #f4f5f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { margin: 0; background: #000; color: #333; }

        /* --- OVERLAY --- */
        #overlay { 
            position: fixed; inset: 0; background: #000; z-index: 1000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        #card { background: #fff; width: 100%; max-width: 350px; border-radius: 20px; padding: 20px; text-align: center; }
        #canvas-wrap { 
            position: relative; width: 280px; height: 320px; margin: 15px auto; 
            background: #111; border-radius: 15px; overflow: hidden; border: 4px solid var(--gold);
        }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; }
        .hidden-msg { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; padding: 15px; z-index: 1; text-align: center;
        }

        /* --- BILLING APP --- */
        #app { display: none; background: var(--bg); min-height: 100vh; padding: 10px; }
        #bill { background: #fff; width: 100%; max-width: 600px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .logo { width: 60px; height: 60px; border-radius: 8px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { font-size: 11px; font-weight: bold; color: #666; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8f9fa; padding: 10px; font-size: 11px; text-align: left; }
        td { padding: 10px 0; border-bottom: 1px solid #eee; }
        
        .total-box { margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px; width: 200px; margin-left: auto; }
        .t-row { display: flex; justify-content: space-between; padding: 5px 0; font-weight: bold; }
        .balance { color: var(--primary); font-size: 20px; }

        #sig-canvas { border: 1px dashed #ccc; width: 100%; height: 120px; background: #fafafa; border-radius: 8px; margin-top: 10px; touch-action: none; }
        
        .btns { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-p { background: #333; color: #fff; padding: 16px; border: none; border-radius: 8px; font-weight: bold; }
        .btn-w { background: #25d366; color: #fff; padding: 16px; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<audio id="bday-audio" loop>
    <source src="https://actions.google.com/config/promo/sdk/v1/projects/master-9ef1e/slots/promos/birthday_song.mp3" type="audio/mpeg">
</audio>

<div id="overlay">
    <div id="card">
        <h2 style="color:var(--primary); margin:0;">✨ SURPRISE ✨</h2>
        <div id="canvas-wrap">
            <div class="hidden-msg">
                <p>Bro you didn't level up...<br>You <b>unlocked a new chapter</b> 😎</p>
                <p style="font-size: 12px;">Same attitude ✔ Same grind ✔<br>Bigger wins loading... 📈</p>
                <p style="font-size: 12px;">Stay real. Stay sharp. 👊<br>and dont forget me 😁</p>
            </div>
            <canvas id="scratch-canvas" width="280" height="320"></canvas>
        </div>
        <button onclick="showBill()" style="background:var(--primary); color:white; border:none; padding:15px; border-radius:10px; width:100%; font-weight:bold;">ENTER BILLING PORTAL</button>
    </div>
</div>

<div id="app">
    <div id="bill">
        <div class="header">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="logo.png" class="logo" onerror="this.src='https://via.placeholder.com/60?text=NT'">
                <div>
                    <h2 style="margin:0; font-size: 18px; color:var(--primary);">NAVEED TEXTILES</h2>
                    <small>Ph: 9906403030</small>
                </div>
            </div>
            <div style="text-align: right;">
                <b>NT-2026</b><br>
                <small id="date"></small>
            </div>
        </div>

        <div class="input-grid">
            <div><label>CUSTOMER</label><input id="c-name"></div>
            <div><label>PHONE</label><input id="c-phone"></div>
        </div>
        <div><label>ADDRESS</label><input id="c-addr"></div>

        <table>
            <thead><tr><th>ITEM</th><th width="50">QTY</th><th width="80">RATE</th></tr></thead>
            <tbody id="items">
                <tr>
                    <td><input placeholder="Item..."></td>
                    <td><input type="number" value="1" oninput="calc()"></td>
                    <td><input type="number" value="0" oninput="calc()"></td>
                </tr>
            </tbody>
        </table>
        <button style="border:none; background:#eee; padding:5px 10px; border-radius:4px; margin-top:10px; font-size:11px;" onclick="addRow()">+ Add Row</button>

        <div class="total-box">
            <div class="t-row"><span>Total</span><span id="sub">0</span></div>
            <div class="t-row"><span>Paid</span><input id="paid" type="number" value="0" oninput="calc()" style="width:70px; text-align:right"></div>
            <div class="t-row balance"><span>Balance</span><span id="bal">0</span></div>
        </div>

        <div style="margin-top:20px;">
            <div style="display:flex; justify-content:space-between; font-size:11px;">
                <b>AUTHORIZED SIGNATURE</b>
                <span style="color:red; cursor:pointer;" onclick="clearSig()">CLEAR</span>
            </div>
            <canvas id="sig-canvas"></canvas>
        </div>
    </div>

    <div class="btns">
        <button class="btn-p" onclick="savePDF()">DOWNLOAD PDF</button>
        <button class="btn-w" onclick="savePDF()">WHATSAPP BILL</button>
    </div>
</div>

<script>
    document.getElementById('date').innerText = new Date().toLocaleDateString();
    const audio = document.getElementById('bday-audio');
    const sCanvas = document.getElementById('scratch-canvas');
    const sCtx = sCanvas.getContext('2d');
    
    // --- SCRATCH LOGIC ---
    sCtx.fillStyle = '#C0C0C0';
    sCtx.fillRect(0,0,280,320);
    sCtx.globalCompositeOperation = 'destination-out';

    let isScratching = false;
    function scratch(e) {
        const rect = sCanvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        sCtx.beginPath();
        sCtx.arc(x, y, 35, 0, Math.PI * 2);
        sCtx.fill();
        if(audio.paused) audio.play();
    }

    sCanvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); e.preventDefault(); });
    sCanvas.addEventListener('touchmove', (e) => { if(isScratching) scratch(e); e.preventDefault(); });
    window.addEventListener('touchend', () => isScratching = false);

    function showBill() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        audio.pause();
        initSig(); // Initialize signature only when app opens
    }

    // --- BILLING LOGIC ---
    function calc() {
        let t = 0;
        document.querySelectorAll("#items tr").forEach(r => {
            const q = r.cells[1].querySelector('input').value || 0;
            const ra = r.cells[2].querySelector('input').value || 0;
            t += (q * ra);
        });
        const p = document.getElementById('paid').value || 0;
        document.getElementById('sub').innerText = t;
        document.getElementById('bal').innerText = t - p;
    }

    function addRow() {
        const tr = document.getElementById('items').insertRow();
        tr.innerHTML = `<td><input></td><td><input type="number" value="1" oninput="calc()"></td><td><input type="number" value="0" oninput="calc()"></td>`;
    }

    // --- SIGNATURE LOGIC (FIXED) ---
    let sigCanvas, sigCtx, drawing = false;
    function initSig() {
        sigCanvas = document.getElementById('sig-canvas');
        sigCtx = sigCanvas.getContext('2d');
        sigCanvas.width = sigCanvas.offsetWidth;
        sigCanvas.height = 120;
        sigCtx.lineWidth = 2;
        sigCtx.strokeStyle = "#000";

        const startDraw = (e) => {
            drawing = true;
            const pos = getSigPos(e);
            sigCtx.beginPath();
            sigCtx.moveTo(pos.x, pos.y);
        };
        const moveDraw = (e) => {
            if(!drawing) return;
            const pos = getSigPos(e);
            sigCtx.lineTo(pos.x, pos.y);
            sigCtx.stroke();
            e.preventDefault();
        };

        sigCanvas.addEventListener('mousedown', startDraw);
        sigCanvas.addEventListener('mousemove', moveDraw);
        sigCanvas.addEventListener('touchstart', startDraw);
        sigCanvas.addEventListener('touchmove', moveDraw);
        window.addEventListener('mouseup', () => drawing = false);
        window.addEventListener('touchend', () => drawing = false);
    }

    function getSigPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        return {
            x: (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left,
            y: (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top
        };
    }
    function clearSig() { sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); }

    // --- PDF LOGIC ---
    async function savePDF() {
        // Sync values to attributes for capture
        document.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
        const bill = document.getElementById('bill');
        const canvas = await html2canvas(bill, { scale: 3 });
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, (canvas.height * 210) / canvas.width);
        pdf.save('Bill.pdf');
    }
</script>
</body>
</html>
