<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naveed Textiles Invoice</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
--main:#1a1a1a;
--accent:#ff6b00;
--bg:#f4f7f6;
--white:#ffffff;
}
*{box-sizing:border-box;font-family:'Segoe UI',Arial}
body{margin:0;background:#000}

/* ---------------- GATE ---------------- */
#birthday-gate{
position:fixed;inset:0;background:#000;z-index:9999;
display:flex;align-items:center;justify-content:center;
padding:20px;
}
.gate-card{
background:#fff;border-radius:20px;padding:30px;
width:100%;max-width:350px;text-align:center;
box-shadow:0 0 30px rgba(255,107,0,.35);
}
.logo-circle{
width:120px;height:120px;margin:0 auto 15px;
border-radius:50%;overflow:hidden;
border:3px solid var(--accent);
background:#fff;
}
.logo-circle img{
width:100%;
height:100%;
object-fit:contain;
padding:10px;
}
.tap-msg{
color:var(--accent);
font-weight:900;
margin-top:15px;
animation:blink 1.5s infinite;
}
@keyframes blink{50%{opacity:.3}}

/* ---------------- APP ---------------- */
#app-portal{display:none;background:var(--bg);min-height:100vh;padding-bottom:120px}
#invoice-container{
background:#fff;
max-width:800px;
margin:auto;
box-shadow:0 5px 30px rgba(0,0,0,.15);
}

.bill-header{
background:var(--main);
color:#fff;
padding:35px;
position:relative;
}
.bill-header h1{
margin:0;
color:var(--accent);
letter-spacing:1px;
}
.header-logo{
position:absolute;
top:25px;
right:25px;
width:80px;
height:80px;
background:#fff;
border-radius:10px;
padding:6px;
}
.header-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.invoice-body{padding:30px}
label{
font-size:11px;
font-weight:800;
color:#777;
text-transform:uppercase;
}
input{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

.client{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}
th{
background:#f8f8f8;
font-size:12px;
padding:12px;
border-bottom:2px solid #eee;
}
td{
padding:10px;
border-bottom:1px solid #eee;
}
.item-total{
text-align:right;
font-weight:800;
}

.totals{
max-width:300px;
margin-left:auto;
margin-top:30px;
border-top:2px solid var(--main);
padding-top:15px;
}
.sum{
display:flex;
justify-content:space-between;
font-weight:800;
margin:6px 0;
}
.grand{
font-size:22px;
color:var(--accent);
}

.action-bar{
position:fixed;
bottom:0;left:0;right:0;
display:flex;
gap:10px;
padding:15px;
background:#fff;
border-top:1px solid #ddd;
}
.btn{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-weight:900;
font-size:16px;
}
.btn-download{background:#000;color:#fff}
.btn-wa{background:#25d366;color:#fff}

.no-print{}
@media print{
.no-print,.action-bar{display:none}
body{background:#fff}
}
</style>
</head>

<body>

<audio id="bday-track" preload="auto">
<source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
</audio>

<!-- GATE -->
<div id="birthday-gate">
<div class="gate-card">
<div class="logo-circle">
<img src="logo.png" alt="Naveed Textiles Logo" crossorigin="anonymous">
</div>
<h2>NAVEED TEXTILES</h2>
<p>🎂 Happy Birthday Naveed 🎂</p>
<div class="tap-msg">TAP TO START</div>
</div>
</div>

<!-- APP -->
<div id="app-portal">
<div id="invoice-container">

<div class="bill-header">
<h1>NAVEED TEXTILES</h1>
<p>Professional Invoice</p>
<div class="header-logo">
<img src="logo.png" alt="Logo" crossorigin="anonymous">
</div>
</div>

<div class="invoice-body">

<div class="client">
<div>
<label>Bill To</label>
<input id="cname" placeholder="Customer Name">
</div>
<div>
<label>Phone</label>
<input placeholder="Phone Number">
</div>
</div>

<table>
<thead>
<tr>
<th>Description</th>
<th width="70">Qty</th>
<th width="100">Rate</th>
<th width="120" style="text-align:right">Total</th>
</tr>
</thead>
<tbody id="rows">
<tr>
<td><input></td>
<td><input type="number" value="1" oninput="calc()"></td>
<td><input type="number" value="0" oninput="calc()"></td>
<td class="item-total">₹0.00</td>
</tr>
</tbody>
</table>

<button onclick="addRow()" class="no-print" style="margin-top:15px;">+ ADD ITEM</button>

<div class="totals">
<div class="sum"><span>Sub Total</span><span id="sub">₹0.00</span></div>
<div class="sum grand"><span>Balance Due</span><span id="bal">₹0.00</span></div>
</div>

</div>
</div>

<div class="action-bar no-print">
<button class="btn btn-download" onclick="makePDF()">📥 DOWNLOAD PDF</button>
<button class="btn btn-wa" onclick="makePDF()">📱 WHATSAPP</button>
</div>
</div>

<script>
const music=document.getElementById("bday-track");

/* -------- GATE + MUSIC (FIXED) -------- */
document.getElementById("birthday-gate").addEventListener("click",()=>{
music.volume=0.3;
music.play().catch(()=>{});
document.getElementById("birthday-gate").style.display="none";
document.getElementById("app-portal").style.display="block";
});

/* -------- BILL -------- */
function calc(){
let sum=0;
document.querySelectorAll("#rows tr").forEach(r=>{
let q=Number(r.children[1].firstChild.value)||0;
let p=Number(r.children[2].firstChild.value)||0;
let t=q*p;
r.querySelector(".item-total").innerText="₹"+t.toFixed(2);
sum+=t;
});
document.getElementById("sub").innerText="₹"+sum.toFixed(2);
document.getElementById("bal").innerText="₹"+sum.toFixed(2);
}

function addRow(){
document.getElementById("rows").insertAdjacentHTML("beforeend",`
<tr>
<td><input></td>
<td><input type="number" value="1" oninput="calc()"></td>
<td><input type="number" value="0" oninput="calc()"></td>
<td class="item-total">₹0.00</td>
</tr>
`);
}

/* -------- PDF (NO HALF CUT) -------- */
async function makePDF(){
const el=document.getElementById("invoice-container");
const canvas=await html2canvas(el,{scale:2,useCORS:true});
const img=canvas.toDataURL("image/jpeg",1);
const {jsPDF}=window.jspdf;
const pdf=new jsPDF("p","mm","a4");

const pdfW=210;
const pdfH=(canvas.height*pdfW)/canvas.width;
let y=0;

pdf.addImage(img,"JPEG",0,y,pdfW,pdfH);
let left=pdfH-297;

while(left>0){
y-=297;
pdf.addPage();
pdf.addImage(img,"JPEG",0,y,pdfW,pdfH);
left-=297;
}

pdf.save("Naveed_Textiles_Invoice.pdf");
}
</script>

</body>
</html>
