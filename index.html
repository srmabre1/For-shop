<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naveed Textiles Invoice</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
--main:#1a1a1a;
--accent:#ff6b00;
--bg:#f4f7f6;
--white:#fff;
}
*{box-sizing:border-box;font-family:Segoe UI,Arial}
body{margin:0;background:#000}

/* ---------- GATE ---------- */
#birthday-gate{
position:fixed;inset:0;background:#000;z-index:9999;
display:flex;align-items:center;justify-content:center;
}
.gate-card{
background:#fff;border-radius:20px;padding:30px;
text-align:center;max-width:340px;width:100%;
box-shadow:0 0 30px rgba(255,107,0,.3);
}
.logo-circle{
width:120px;height:120px;margin:auto;border-radius:50%;
overflow:hidden;border:3px solid var(--accent);
}
.logo-circle img{width:100%;height:100%;object-fit:contain}
.tap-msg{color:var(--accent);font-weight:900;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- APP ---------- */
#app-portal{display:none;background:var(--bg);min-height:100vh}
#invoice-container{max-width:800px;margin:auto;background:#fff}

.bill-header{
background:var(--main);color:#fff;padding:35px;
position:relative;
}
.header-logo{
position:absolute;right:25px;top:25px;
width:70px;height:70px;background:#fff;border-radius:10px;
padding:6px;
}
.header-logo img{width:100%;height:100%;object-fit:contain}

.invoice-body{padding:30px}
input{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border-bottom:1px solid #eee;padding:10px}
th{background:#f7f7f7}

.totals{
max-width:300px;margin-left:auto;margin-top:30px
}
.row{display:flex;justify-content:space-between;font-weight:700}
.grand{font-size:22px;color:var(--accent)}

.action-bar{
position:fixed;bottom:0;left:0;right:0;
display:flex;gap:10px;padding:15px;background:#fff;
}
.btn{flex:1;padding:15px;border:none;border-radius:12px;font-weight:900}
.btn-download{background:#000;color:#fff}
.btn-wa{background:#25d366;color:#fff}

.no-print{}
@media print{
.no-print,.action-bar{display:none}
body{background:#fff}
}
</style>
</head>

<body>

<audio id="bday-track">
<source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3">
</audio>

<!-- GATE -->
<div id="birthday-gate">
<div class="gate-card">
<div class="logo-circle">
<img src="logo.jpg" onerror="logoFallback(event)">
</div>
<h2>NAVEED TEXTILES</h2>
<p>🎂 Happy Birthday Naveed 🎂</p>
<div class="tap-msg">TAP TO ENTER</div>
</div>
</div>

<!-- APP -->
<div id="app-portal">
<div id="invoice-container">
<div class="bill-header">
<h1 style="color:var(--accent);margin:0">NAVEED TEXTILES</h1>
<p>Professional Invoice</p>
<div class="header-logo">
<img src="logo.jpg" onerror="logoFallback(event)">
</div>
</div>

<div class="invoice-body">
<input id="c-name" placeholder="Customer Name">

<table>
<thead>
<tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr>
</thead>
<tbody id="rows">
<tr>
<td><input></td>
<td><input type="number" value="1" oninput="calc()"></td>
<td><input type="number" value="0" oninput="calc()"></td>
<td class="t">₹0.00</td>
</tr>
</tbody>
</table>

<button onclick="addRow()" class="no-print">+ ADD ITEM</button>

<div class="totals">
<div class="row"><span>Sub</span><span id="sub">₹0.00</span></div>
<div class="row grand"><span>Balance</span><span id="bal">₹0.00</span></div>
</div>
</div>
</div>

<div class="action-bar no-print">
<button class="btn btn-download" onclick="makePDF()">DOWNLOAD PDF</button>
<button class="btn btn-wa" onclick="makePDF()">WHATSAPP</button>
</div>
</div>

<script>
const music=document.getElementById("bday-track");

/* ---------- FIX 1 + 2 : GATE + MUSIC ---------- */
document.getElementById("birthday-gate").onclick=()=>{
music.volume=.3;
music.play().catch(()=>{});
document.getElementById("birthday-gate").style.display="none";
document.getElementById("app-portal").style.display="block";
};

/* ---------- FIX 5 : SAFE LOGO ---------- */
function logoFallback(e){
e.target.src="data:image/svg+xml;base64,"+btoa(`
<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'>
<rect width='100%' height='100%' fill='#ff6b00'/>
<text x='50%' y='60%' font-size='36' text-anchor='middle' fill='white' font-weight='bold'>NT</text>
</svg>`);
}

/* ---------- BILL ---------- */
function calc(){
let s=0;
document.querySelectorAll("#rows tr").forEach(r=>{
let q=r.children[1].firstChild.value||0;
let p=r.children[2].firstChild.value||0;
let t=q*p;
r.querySelector(".t").innerText="₹"+t.toFixed(2);
s+=t;
});
document.getElementById("sub").innerText="₹"+s.toFixed(2);
document.getElementById("bal").innerText="₹"+s.toFixed(2);
}

function addRow(){
rows.innerHTML+=`
<tr>
<td><input></td>
<td><input type="number" value="1" oninput="calc()"></td>
<td><input type="number" value="0" oninput="calc()"></td>
<td class="t">₹0.00</td>
</tr>`;
}

/* ---------- PDF FIX (NO HALF CUT) ---------- */
async function makePDF(){
const el=document.getElementById("invoice-container");
const canvas=await html2canvas(el,{scale:2});
const img=canvas.toDataURL("image/jpeg",1);
const {jsPDF}=window.jspdf;
const pdf=new jsPDF("p","mm","a4");

const w=210;
const h=(canvas.height*w)/canvas.width;
let y=0;

pdf.addImage(img,"JPEG",0,y,w,h);
let left=h-297;

while(left>0){
y-=297;
pdf.addPage();
pdf.addImage(img,"JPEG",0,y,w,h);
left-=297;
}
pdf.save("Naveed_Invoice.pdf");
}
</script>

</body>
</html>
