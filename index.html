<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles | Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --brand: #1a1a1a; --accent: #ff6b00; --bg: #f2f4f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: #000; overflow-x: hidden; }

        /* --- BIRTHDAY SCRATCH CARD (With Restricted Music) --- */
        #gate { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        #scratch-box { background: #fff; width: 100%; max-width: 360px; border-radius: 20px; padding: 20px; text-align: center; }
        #canvas-wrap { 
            position: relative; width: 280px; height: 320px; margin: 15px auto; 
            background: #111; border-radius: 15px; overflow: hidden; border: 4px solid var(--accent);
        }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; cursor: crosshair; }
        .gift-text { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; padding: 20px; z-index: 1;
        }

        /* --- PROFESSIONAL BILLING PORTAL --- */
        #portal { display: none; background: var(--bg); min-height: 100vh; padding-bottom: 120px; }
        #bill-ui { background: #fff; width: 100%; max-width: 800px; margin: 0 auto; overflow: visible; }
        
        .header { 
            background: var(--brand); color: #fff; padding: 40px 25px 70px; 
            clip-path: polygon(0 0, 100% 0, 100% 88%, 0% 100%);
            display: flex; justify-content: space-between;
        }
        #logo-preview { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; border: 2px solid var(--accent); background: #333; cursor: pointer; }
        
        .body-content { padding: 30px; margin-top: -30px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        input { padding: 12px; border: 1.5px solid #eee; border-radius: 8px; font-size: 14px; width: 100%; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); background: #fff; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #f8f9fa; padding: 12px; font-size: 11px; }
        td { padding: 10px 5px; border-bottom: 1px solid #eee; }
        
        .summary-card { margin-top: 30px; width: 260px; margin-left: auto; border-top: 3px solid var(--brand); padding-top: 15px; }
        .s-line { display: flex; justify-content: space-between; padding: 6px 0; font-weight: 700; }
        .total-row { font-size: 24px; color: var(--accent); border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px; }

        #sig-pad { border: 2px dashed #ddd; width: 100%; height: 140px; border-radius: 12px; background: #fafafa; margin-top: 10px; touch-action: none; }
        
        .action-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 10px;
        }
        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; }
        .btn-pdf { background: var(--brand); color: #fff; }
        .btn-wa { background: #25d366; color: #fff; }
    </style>
</head>
<body onclick="initAudio()">

<audio id="surprise-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="gate">
    <div id="scratch-box">
        <h2 style="color:var(--accent); margin:0;">NAVEED TEXTILES</h2>
        <div id="canvas-wrap">
            <div class="gift-text">
                <p style="font-size:18px;"><b>Surprise!</b> 🎁</p>
                <p>10% Birthday Discount</p>
                <div style="font-size:11px; opacity:0.8; margin-top:10px;">
                    Valid only for Naveed.<br>Scratch to unlock portal.
                </div>
            </div>
            <canvas id="scratch-canvas" width="280" height="320"></canvas>
        </div>
        <p style="font-size:12px; color:#666;">Scratch & then Click Enter</p>
        <button onclick="revealApp()" class="btn btn-pdf" style="width:100%; margin-top:10px;">ENTER PORTAL</button>
    </div>
</div>

<div id="portal">
    <div id="bill-ui">
        <div class="header">
            <div>
                <input type="file" id="logo-in" style="display:none" onchange="updateLogo(event)">
                <img id="logo-preview" src="https://via.placeholder.com/80?text=LOGO" onclick="document.getElementById('logo-in').click()">
                <h1 style="margin:10px 0 0; font-size:22px; color:var(--accent);">NAVEED TEXTILES</h1>
            </div>
            <div style="text-align: right;">
                <b style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-size:11px;">OFFICIAL INVOICE</b>
                <p id="bill-date" style="margin:10px 0 0; font-size:14px;"></p>
                <small>INV #NT-2026</small>
            </div>
        </div>

        <div class="body-content">
            <div class="input-row">
                <div><label>Customer Name</label><input id="c-name" placeholder="Name"></div>
                <div><label>Contact No.</label><input id="c-phone" placeholder="Phone"></div>
            </div>
            <div style="margin-bottom:20px;"><label>Shipping Address</label><input id="c-addr" placeholder="City/Street"></div>

            <table>
                <thead>
                    <tr><th>DESCRIPTION</th><th width="50">QTY</th><th width="90">RATE</th><th width="90" style="text-align:right">TOTAL</th></tr>
                </thead>
                <tbody id="rows">
                    <tr>
                        <td><input placeholder="Suit detail..." style="border:none; width:100%;" class="p-desc"></td>
                        <td><input type="number" value="1" class="p-qty" oninput="doCalc()"></td>
                        <td><input type="number" value="0" class="p-rate" oninput="doCalc()"></td>
                        <td style="text-align:right; font-weight:800;" class="p-total">0</td>
                    </tr>
                </tbody>
            </table>
            <button onclick="addRow()" style="margin-top:10px; background:none; border:1px solid #ddd; padding:5px 12px; border-radius:5px; font-size:12px; cursor:pointer;">+ ADD ROW</button>

            <div class="summary-card">
                <div class="s-line"><span>Sub-Total</span><span id="sub-view">0</span></div>
                <div class="s-line" style="color:red;"><span>Discount %</span><input id="disc" type="number" value="0" oninput="doCalc()" style="width:60px; text-align:right; border:none; background:none; font-weight:700;"></div>
                <div class="s-line"><span>Paid</span><input id="paid" type="number" value="0" oninput="doCalc()" style="width:80px; text-align:right; border:none; background:none; font-weight:700;"></div>
                <div class="s-line total-row"><span>Balance Due</span><span id="bal-view">0</span></div>
            </div>

            <div style="margin-top:40px;">
                <div style="display:flex; justify-content:space-between;"><label>Authorized Sign</label><span onclick="clearSig()" style="color:red; font-size:10px; font-weight:900; cursor:pointer;">[ CLEAR ]</span></div>
                <canvas id="sig-pad"></canvas>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-pdf" onclick="saveFullPDF()">DOWNLOAD FULL INVOICE</button>
        <button class="btn btn-wa" onclick="saveFullPDF()">SEND ON WHATSAPP</button>
    </div>
</div>

<script>
    // --- Restricted Music Logic ---
    const song = document.getElementById('surprise-music');
    let musicAllowed = true;
    let audioContextUnlocked = false;

    // Check 2-day validity
    const START_DATE = new Date("2026-01-18").getTime();
    if ((Date.now() - START_DATE) > (2 * 24 * 60 * 60 * 1000)) musicAllowed = false;

    function initAudio() {
        if(!audioContextUnlocked && musicAllowed) {
            song.play().then(() => { song.pause(); audioContextUnlocked = true; }).catch(()=>{});
        }
    }

    // --- Scratch Logic ---
    const sc = document.getElementById('scratch-canvas');
    const sctx = sc.getContext('2d');
    sctx.fillStyle = '#C0C0C0';
    sctx.fillRect(0,0,280,320);
    sctx.globalCompositeOperation = 'destination-out';
    let scratching = false;

    function handleScratch(e) {
        if(!scratching) return;
        const r = sc.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - r.left;
        const y = (e.clientY || e.touches[0].clientY) - r.top;
        sctx.beginPath(); sctx.arc(x, y, 40, 0, Math.PI*2); sctx.fill();
        if(audioContextUnlocked) song.play();
    }
    sc.addEventListener('touchstart', (e)=>{scratching=true; handleScratch(e); e.preventDefault();});
    sc.addEventListener('touchmove', handleScratch);
    window.addEventListener('touchend', ()=>scratching=false);

    function revealApp() {
        song.pause(); // Music stops immediately on enter
        document.getElementById('gate').style.display = 'none';
        document.getElementById('portal').style.display = 'block';
        document.getElementById('bill-date').innerText = new Date().toLocaleDateString('en-GB');
        initSignature();
    }

    // --- Calculation & UI ---
    function doCalc() {
        let sub = 0;
        document.querySelectorAll('#rows tr').forEach(r => {
            const q = r.querySelector('.p-qty').value || 0;
            const ra = r.querySelector('.p-rate').value || 0;
            const t = q * ra;
            r.querySelector('.p-total').innerText = t.toLocaleString();
            sub += t;
        });
        const d = document.getElementById('disc').value || 0;
        const p = document.getElementById('paid').value || 0;
        const total = (sub - (sub * d / 100)) - p;
        document.getElementById('sub-view').innerText = sub.toLocaleString();
        document.getElementById('bal-view').innerText = total.toLocaleString();
    }

    function addRow() {
        const tr = document.getElementById('rows').insertRow();
        tr.innerHTML = `<td><input placeholder="Item..." style="border:none; width:100%;" class="p-desc"></td><td><input type="number" value="1" class="p-qty" oninput="doCalc()"></td><td><input type="number" value="0" class="p-rate" oninput="doCalc()"></td><td style="text-align:right; font-weight:800;" class="p-total">0</td>`;
    }

    function updateLogo(e) {
        document.getElementById('logo-preview').src = URL.createObjectURL(e.target.files[0]);
    }

    // --- Signature ---
    let pCan, pCtx, drawing = false;
    function initSignature() {
        pCan = document.getElementById('sig-pad');
        pCtx = pCan.getContext('2d');
        pCan.width = pCan.offsetWidth; pCan.height = 140;
        pCtx.lineWidth = 2.5; pCtx.strokeStyle = "#000";
        const getXY = (e) => {
            const r = pCan.getBoundingClientRect();
            return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top };
        };
        pCan.addEventListener('touchstart', (e)=>{drawing=true; const p=getXY(e); pCtx.beginPath(); pCtx.moveTo(p.x, p.y); e.preventDefault();});
        pCan.addEventListener('touchmove', (e)=>{if(!drawing) return; const p=getXY(e); pCtx.lineTo(p.x, p.y); pCtx.stroke(); e.preventDefault();});
        window.addEventListener('touchend', ()=>drawing=false);
    }
    function clearSig() { pCtx.clearRect(0,0,pCan.width,pCan.height); }

    // --- THE FULL PDF SNAPSHOT FIX ---
    async function saveFullPDF() {
        // Step 1: Force data into attributes for capture
        document.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
        
        const bill = document.getElementById('bill-ui');
        window.scrollTo(0,0); // Essential for mobile capture accuracy
        
        const canvas = await html2canvas(bill, {
            scale: 2,
            useCORS: true,
            height: bill.scrollHeight, // Ensures bottom items are captured
            windowHeight: bill.scrollHeight,
            scrollY: -window.scrollY
        });

        const img = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        const pdfW = 210;
        const pdfH = (canvas.height * pdfW) / canvas.width;
        
        pdf.addImage(img, 'PNG', 0, 0, pdfW, pdfH);
        pdf.save('Naveed_Textiles_Invoice.pdf');
    }
</script>
</body>
</html>
