<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles - Birthday Edition</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --primary: #2196f3; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        
        /* Bill Styles */
        #bill { width: 100%; max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #f8f9fa; padding: 10px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .grand-total { font-weight: bold; color: var(--primary); font-size: 20px; border-top: 2px solid #eee; margin-top: 10px; padding-top: 10px; display: flex; justify-content: space-between; }

        /* PDF Export Fix */
        .no-export { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-row { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; font-weight: bold; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
        .btn-pdf { background: #455a64; }
        .btn-wa { background: #25d366; }
        .btn-new { background: #f44336; }
        .hidden-pdf { display: none !important; }

        /* --- Birthday Animation Styles --- */
        #bd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        #card { background: #fff; padding: 20px; border-radius: 20px; text-align: center; width: 90%; max-width: 380px; }
        
        #scratch-container { position: relative; width: 300px; height: 350px; margin: 15px auto; background: #111; border-radius: 15px; overflow: hidden; border: 3px solid var(--gold); }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; cursor: crosshair; }

        .birthday-text { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; padding: 20px; 
            text-align: center; z-index: 1;
        }

        /* The Animation you asked for */
        .animate-msg { animation: popIn 1.5s ease-out forwards, glow 2s infinite alternate; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes glow { from { text-shadow: 0 0 5px #fff, 0 0 10px var(--gold); } to { text-shadow: 0 0 10px #fff, 0 0 20px var(--primary); } }

        #sig { border: 1px dashed #ccc; width: 100%; height: 100px; background: #fafafa; margin-top: 10px; }
    </style>
</head>
<body>

<audio id="bday-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="bd-overlay">
    <div id="card">
        <h2 style="color:var(--primary); margin:0;">🎂 NAVEED'S DAY 🎂</h2>
        <div id="scratch-container">
            <div class="birthday-text" id="revealed-msg">
                <h3 style="color:var(--gold); margin:0;">Level Up! 🚀</h3>
                <p>Bro, you didn't just age...<br>You <b>unlocked a new chapter</b> 😎</p>
                <p>Same Attitude ✔<br>Same Grind ✔<br>Bigger Wins Loading... 📈</p>
                <p style="font-size: 12px;">Stay real. Stay sharp. 👊</p>
            </div>
            <canvas id="scratch-canvas" width="300" height="350"></canvas>
        </div>
        <button onclick="closeBday()" style="background:var(--primary); width:100%">Open My Bill</button>
    </div>
</div>

<div id="bill">
    <div class="header">
        <div>
            <h1 style="margin:0; color:var(--primary)">NAVEED TEXTILES</h1>
            <span style="font-size: 12px;">Ph: 9906403030</span>
        </div>
        <div style="text-align: right;">
            <div style="font-weight: bold;">NT-1060</div>
            <div id="date"></div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>NAME <input id="name"></div>
        <div>PHONE <input id="phone"></div>
    </div>

    <table>
        <thead><tr><th>ITEM</th><th width="60">QTY</th><th width="80">RATE</th><th width="80">TOTAL</th></tr></thead>
        <tbody id="rows">
            <tr>
                <td><input placeholder="Item..."></td>
                <td><input type="number" value="1" oninput="calc()"></td>
                <td><input type="number" value="0" oninput="calc()"></td>
                <td style="text-align: right;" class="row-total">0</td>
            </tr>
        </tbody>
    </table>
    <button class="no-export" style="background:#eee; color:#333; width:100px; padding:5px; margin-top:10px;" onclick="addRow()">+ Add</button>

    <div style="width: 200px; margin-left: auto; margin-top: 20px;">
        <div class="grand-total"><span>Total:</span><span id="total-val">0</span></div>
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px;">
        <span style="font-size: 10px;">SIGNATURE:</span>
        <canvas id="sig"></canvas>
    </div>
</div>

<div class="no-export" style="max-width:800px; margin: 20px auto;">
    <div class="btn-row">
        <button class="btn-pdf" onclick="saveFullPDF()">Save PDF</button>
        <button class="btn-wa">WhatsApp</button>
    </div>
    <button class="btn-new" onclick="location.reload()">New Bill</button>
</div>

<script>
    document.getElementById('date').innerText = new Date().toLocaleDateString();
    const music = document.getElementById('bday-music');

    function calc() {
        let grand = 0;
        document.querySelectorAll("#rows tr").forEach(row => {
            const q = row.cells[1].querySelector('input').value || 0;
            const r = row.cells[2].querySelector('input').value || 0;
            const sum = q * r;
            row.querySelector('.row-total').innerText = sum;
            grand += sum;
        });
        document.getElementById('total-val').innerText = grand;
    }

    function addRow() {
        const tr = document.getElementById('rows').insertRow();
        tr.innerHTML = `<td><input></td><td><input type="number" value="1" oninput="calc()"></td><td><input type="number" value="0" oninput="calc()"></td><td style="text-align: right;" class="row-total">0</td>`;
    }

    // Scratch Logic
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#C0C0C0';
    ctx.fillRect(0,0,300,350);
    ctx.globalCompositeOperation = 'destination-out';

    let started = false;
    const scratch = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.beginPath(); ctx.arc(x, y, 35, 0, Math.PI*2); ctx.fill();
        
        if(!started) {
            music.play();
            document.getElementById('revealed-msg').classList.add('animate-msg');
            started = true;
        }
    };
    canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); });
    canvas.addEventListener('mousemove', (e) => { if(e.buttons==1) scratch(e); });

    function closeBday() { 
        document.getElementById('bd-overlay').style.display = 'none'; 
        music.pause(); 
    }

    async function saveFullPDF() {
        document.querySelectorAll('.no-export').forEach(el => el.classList.add('hidden-pdf'));
        const canvasPDF = await html2canvas(document.getElementById('bill'), { scale: 3 });
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        pdf.addImage(canvasPDF.toDataURL('image/png'), 'PNG', 0, 0, 210, (canvasPDF.height * 210) / canvasPDF.width);
        pdf.save('Naveed_Bill.pdf');
        document.querySelectorAll('.hidden-pdf').forEach(el => el.classList.remove('hidden-pdf'));
    }
</script>
</body>
</html>
