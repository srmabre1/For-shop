<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles - Ultra Smooth</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --blue: #1a73e8; --gold: #ffd700; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; touch-action: manipulation; }
        
        #bill { 
            width: 100%; max-width: 800px; margin: auto; background: #fff; 
            padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--blue); padding-bottom: 10px; margin-bottom: 20px; }
        .my-logo { width: 80px; height: 80px; object-fit: contain; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 10px; text-align: left; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .grand-total { text-align: right; font-size: 22px; font-weight: bold; color: var(--blue); margin-top: 20px; padding: 10px; border-top: 2px solid #eee; }

        #sig-canvas { border: 1px dashed #ccc; width: 100%; height: 120px; background: #fafafa; border-radius: 8px; margin-top: 10px; touch-action: none; }

        .no-export { width: 100%; max-width: 800px; margin: 20px auto; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 16px; font-weight: bold; border: none; border-radius: 8px; color: #fff; cursor: pointer; flex: 1; }
        .btn-pdf { background: #455a64; }
        .btn-wa { background: #25d366; }
        .hidden-pdf { display: none !important; }

        /* --- THE SCRATCH FIX --- */
        #bd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: flex; align-items: center; justify-content: center; z-index: 99999; }
        #card { background: #fff; padding: 20px; border-radius: 20px; text-align: center; width: 90%; max-width: 360px; }
        #scratch-container { position: relative; width: 280px; height: 320px; margin: 15px auto; background: #000; border-radius: 15px; overflow: hidden; border: 4px solid var(--gold); }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; }
        
        .reveal-msg { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; padding: 20px; 
            z-index: 1; opacity: 0; transition: opacity 0.5s;
        }
        .active-msg { opacity: 1 !important; animation: bounce 0.8s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); text-shadow: 0 0 15px var(--gold); } }
    </style>
</head>
<body>

<audio id="bday-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>

<div id="bd-overlay">
    <div id="card">
        <h2 style="color:var(--blue); margin:0;">🎂 HAPPY BIRTHDAY NAVEED 🎂</h2>
        <div id="scratch-container">
            <div class="reveal-msg" id="msg">
                <h1 style="color:var(--gold); margin:0;">LEVEL UP! 🚀</h1>
                <p>New Chapter Unlocked 😎</p>
                <div style="text-align: left; font-size: 13px; line-height: 1.6;">
                    ⭐ Same Attitude ✔ ⭐ Same Grind ✔<br>
                    ⭐ Bigger Wins Loading... 📈
                </div>
            </div>
            <canvas id="scratch-canvas" width="280" height="320"></canvas>
        </div>
        <button onclick="closeOverlay()" style="background:var(--blue); width:100%">Open My Bill</button>
    </div>
</div>

<div id="bill">
    <div class="header">
        <div class="logo-area">
            <img src="logo.png" class="my-logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
            <div>
                <h1 style="margin:0; font-size: 22px; color:var(--blue)">NAVEED TEXTILES</h1>
                <span style="font-size: 12px;">Ph: 9906403030</span>
            </div>
        </div>
        <div style="text-align: right; font-weight: bold; color: var(--blue);">INV-1100</div>
    </div>

    <div class="info-grid">
        <input id="name" placeholder="Customer Name">
        <input id="phone" placeholder="Phone Number">
    </div>

    <table>
        <thead><tr><th>ITEM</th><th width="50">QTY</th><th width="80">RATE</th><th width="80">TOTAL</th></tr></thead>
        <tbody id="rows">
            <tr>
                <td><input placeholder="Item..."></td>
                <td><input type="number" value="1" oninput="calc()"></td>
                <td><input type="number" value="0" oninput="calc()"></td>
                <td style="text-align: right; font-weight: bold;" class="r-total">0</td>
            </tr>
        </tbody>
    </table>
    
    <button style="background:#eee; color:#333; padding:5px; margin-top:10px; width:100px;" class="no-export" onclick="addRow()">+ Add</button>

    <div class="grand-total">TOTAL: <span id="grand-val">0</span></div>

    <div id="sig-wrap">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold;">
            <span>SIGNATURE</span>
            <span class="no-export" style="color:red;" onclick="clearSig()">Clear</span>
        </div>
        <canvas id="sig-canvas"></canvas>
    </div>
</div>

<div class="no-export">
    <div style="display:flex; gap:10px;">
        <button class="btn-pdf" onclick="savePDF()">DOWNLOAD PDF</button>
        <button class="btn-wa" onclick="savePDF()">WHATSAPP</button>
    </div>
</div>

<script>
    const music = document.getElementById('bday-music');
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    
    // Set silver layer
    ctx.fillStyle = '#C0C0C0';
    ctx.fillRect(0,0,280,320);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 45;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    let isDrawing = false;
    let started = false;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX || e.touches[0].clientX) - rect.left,
            y: (e.clientY || e.touches[0].clientY) - rect.top
        };
    }

    function start(e) { 
        isDrawing = true; 
        if(!started) { music.play(); document.getElementById('msg').classList.add('active-msg'); started = true; }
        move(e);
    }

    function move(e) {
        if(!isDrawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('touchstart', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, {passive: false});
    window.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
    window.addEventListener('touchend', () => { isDrawing = false; ctx.beginPath(); });

    function closeOverlay() { document.getElementById('bd-overlay').style.display = 'none'; music.pause(); }

    function calc() {
        let grand = 0;
        document.querySelectorAll("#rows tr").forEach(row => {
            const q = row.cells[1].querySelector('input').value || 0;
            const r = row.cells[2].querySelector('input').value || 0;
            const t = q * r;
            row.querySelector('.r-total').innerText = t;
            grand += t;
        });
        document.getElementById('grand-val').innerText = grand;
    }

    function addRow() {
        const tr = document.getElementById('rows').insertRow();
        tr.innerHTML = `<td><input></td><td><input type="number" value="1" oninput="calc()"></td><td><input type="number" value="0" oninput="calc()"></td><td style="text-align: right; font-weight: bold;" class="r-total">0</td>`;
    }

    // Signature
    const sc = document.getElementById('sig-canvas');
    const sctx = sc.getContext('2d');
    sc.width = sc.offsetWidth; sc.height = 120;
    let sDraw = false;
    sc.onpointerdown = (e) => { sDraw = true; sctx.beginPath(); sctx.moveTo(e.offsetX, e.offsetY); };
    sc.onpointermove = (e) => { if(sDraw) { sctx.lineTo(e.offsetX, e.offsetY); sctx.stroke(); } };
    window.onpointerup = () => sDraw = false;
    function clearSig() { sctx.clearRect(0,0,sc.width,sc.height); }

    async function savePDF() {
        document.querySelectorAll('.no-export').forEach(e => e.classList.add('hidden-pdf'));
        const bill = document.getElementById('bill');
        const canvasImg = await html2canvas(bill, { scale: 3 });
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        pdf.addImage(canvasImg.toDataURL('image/png'), 'PNG', 0, 0, 210, (canvasImg.height * 210) / canvasImg.width);
        pdf.save('Naveed_Bill.pdf');
        document.querySelectorAll('.hidden-pdf').forEach(e => e.classList.remove('hidden-pdf'));
    }
</script>
</body>
</html>
