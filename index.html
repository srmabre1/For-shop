<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naveed Textiles | Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --brand: #1a1a1a; --accent: #ff6b00; --bg: #f4f7f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); overflow-x: hidden; }

        /* --- THE SURPRISE GATE --- */
        #gate { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        #scratch-box { background: #fff; width: 100%; max-width: 360px; border-radius: 20px; padding: 20px; text-align: center; }
        #canvas-wrap { 
            position: relative; width: 280px; height: 320px; margin: 15px auto; 
            background: #111; border-radius: 15px; overflow: hidden; border: 4px solid var(--accent);
        }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; cursor: crosshair; }
        .gift-text { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; padding: 20px; z-index: 1;
        }

        /* --- PROFESSIONAL BILLING PORTAL --- */
        #portal { display: block; min-height: 100vh; padding-bottom: 120px; }
        #bill-ui { background: #fff; width: 100%; max-width: 800px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        .header { 
            background: var(--brand); color: #fff; padding: 45px 25px 80px; 
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        /* PERMANENT LOGO STYLE */
        .logo-img { 
            width: 85px; height: 85px; border-radius: 12px; 
            object-fit: cover; border: 2.5px solid var(--accent); background: #fff; 
        }
        
        .body-content { padding: 35px 25px; margin-top: -35px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        label { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        input { padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; width: 100%; outline: none; background: #fafafa; }
        input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(255,107,0,0.1); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #f9f9f9; padding: 15px 10px; font-size: 11px; color: #555; border-bottom: 2px solid #eee; }
        td { padding: 12px 5px; border-bottom: 1px solid #eee; }
        
        .summary-card { margin-top: 40px; width: 280px; margin-left: auto; border-top: 3.5px solid var(--brand); padding-top: 20px; }
        .s-line { display: flex; justify-content: space-between; padding: 8px 0; font-weight: 700; font-size: 15px; }
        .total-row { font-size: 26px; color: var(--accent); border-top: 1px solid #eee; margin-top: 10px; padding-top: 15px; }

        #sig-pad { border: 2px dashed #ccc; width: 100%; height: 140px; border-radius: 12px; background: #fcfcfc; margin-top: 15px; touch-action: none; }
        
        .action-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 450px; display: flex; flex-direction: column; gap: 12px;
        }
        .btn { padding: 18px; border: none; border-radius: 15px; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .btn-pdf { background: var(--brand); color: #fff; }
        .btn-wa { background: #25d366; color: #fff; }
    </style>
</head>
<body onclick="initAudio()">

<audio id="surprise-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="gate">
    <div id="scratch-box">
        <h2 style="color:var(--accent); margin:0;">NAVEED TEXTILES</h2>
        <div id="canvas-wrap">
            <div class="gift-text">
                <p style="font-size:18px;"><b>Surprise!</b> 🎁</p>
                <p>Special Birthday Portal</p>
                <div style="font-size:11px; opacity:0.8; margin-top:10px;">Scratch to unlock music.<br>Happy Birthday Naveed!</div>
            </div>
            <canvas id="scratch-canvas" width="280" height="320"></canvas>
        </div>
        <button onclick="revealApp()" class="btn btn-pdf" style="width:100%; margin-top:10px;">ENTER PORTAL</button>
    </div>
</div>

<div id="portal">
    <div id="bill-ui">
        <div class="header">
            <div>
                <img class="logo-img" src="YOUR_LOGO_URL_HERE" onerror="this.src='https://via.placeholder.com/85?text=LOGO'">
                <h1 style="margin:12px 0 0; font-size:24px; color:var(--accent); letter-spacing:1px;">NAVEED TEXTILES</h1>
                <p style="margin:5px 0 0; opacity:0.8; font-size:12px;">Premium Fabrics & Professional Stitching</p>
            </div>
            <div style="text-align: right;">
                <b style="background:var(--accent); color:#000; padding:4px 10px; border-radius:5px; font-size:11px; font-weight:900;">INVOICE #2026</b>
                <p id="bill-date" style="margin:15px 0 0; font-size:14px; font-weight:bold;"></p>
                <small style="opacity:0.7;">Ph: 9906403030</small>
            </div>
        </div>

        <div class="body-content">
            <div class="input-row">
                <div><label>Client Name</label><input id="c-name" placeholder="Full Name"></div>
                <div><label>Phone Number</label><input id="c-phone" placeholder="+91 ..."></div>
            </div>
            <div style="margin-bottom:25px;"><label>Address</label><input id="c-addr" placeholder="Street / City"></div>

            <table>
                <thead>
                    <tr><th>DESCRIPTION</th><th width="60">QTY</th><th width="100">RATE</th><th width="100" style="text-align:right">TOTAL</th></tr>
                </thead>
                <tbody id="rows">
                    <tr>
                        <td><input placeholder="Enter item..." style="border:none; width:100%; background:transparent;" class="p-desc"></td>
                        <td><input type="number" value="1" class="p-qty" oninput="doCalc()"></td>
                        <td><input type="number" value="0" class="p-rate" oninput="doCalc()"></td>
                        <td style="text-align:right; font-weight:800;" class="p-total">0</td>
                    </tr>
                </tbody>
            </table>
            <button onclick="addRow()" style="margin-top:15px; background:none; border:1px solid #ccc; padding:8px 15px; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer;">+ ADD NEW LINE</button>

            <div class="summary-card">
                <div class="s-line"><span>Sub-Total</span><span id="sub-view">0</span></div>
                <div class="s-line" style="color:#d00000;"><span>Discount (%)</span><input id="disc" type="number" value="0" oninput="doCalc()" style="width:70px; text-align:right; border:none; background:none; font-weight:800;"></div>
                <div class="s-line"><span>Amount Paid</span><input id="paid" type="number" value="0" oninput="doCalc()" style="width:90px; text-align:right; border:none; background:none; font-weight:800;"></div>
                <div class="s-line total-row"><span>Balance Due</span><span id="bal-view">0</span></div>
            </div>

            <div style="margin-top:50px;">
                <div style="display:flex; justify-content:space-between;"><label>Authorized Signature</label><span onclick="clearSig()" style="color:red; font-size:10px; font-weight:900; cursor:pointer;">[ CLEAR ]</span></div>
                <canvas id="sig-pad"></canvas>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-pdf" onclick="saveFullPDF()">DOWNLOAD FULL INVOICE</button>
        <button class="btn btn-wa" onclick="saveFullPDF()">SHARE VIA WHATSAPP</button>
    </div>
</div>

<script>
    // --- GATE EXPIRY LOGIC (2 DAYS) ---
    const song = document.getElementById('surprise-music');
    const START_TIME = new Date("2026-01-18").getTime();
    const CURRENT_TIME = Date.now();
    const TWO_DAYS = 2 * 24 * 60 * 60 * 1000;

    window.onload = function() {
        if ((CURRENT_TIME - START_TIME) < TWO_DAYS) {
            document.getElementById('gate').style.display = 'flex';
            document.getElementById('portal').style.display = 'none';
        }
        document.getElementById('bill-date').innerText = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});
    };

    let audioContextUnlocked = false;
    function initAudio() {
        if(!audioContextUnlocked) {
            song.play().then(() => { song.pause(); audioContextUnlocked = true; }).catch(()=>{});
        }
    }

    // --- Scratch Logic ---
    const sc = document.getElementById('scratch-canvas');
    const sctx = sc.getContext('2d');
    sctx.fillStyle = '#C0C0C0';
    sctx.fillRect(0,0,280,320);
    sctx.globalCompositeOperation = 'destination-out';
    let scratching = false;

    function handleScratch(e) {
        if(!scratching) return;
        const r = sc.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - r.left;
        const y = (e.clientY || e.touches[0].clientY) - r.top;
        sctx.beginPath(); sctx.arc(x, y, 40, 0, Math.PI*2); sctx.fill();
        if(audioContextUnlocked) song.play();
    }
    sc.addEventListener('touchstart', (e)=>{scratching=true; handleScratch(e); e.preventDefault();});
    sc.addEventListener('touchmove', handleScratch);
    window.addEventListener('touchend', ()=>scratching=false);

    function revealApp() {
        song.pause();
        document.getElementById('gate').style.display = 'none';
        document.getElementById('portal').style.display = 'block';
        initSignature();
    }

    // --- Calculations ---
    function doCalc() {
        let sub = 0;
        document.querySelectorAll('#rows tr').forEach(r => {
            const q = r.querySelector('.p-qty').value || 0;
            const ra = r.querySelector('.p-rate').value || 0;
            const t = q * ra;
            r.querySelector('.p-total').innerText = t.toLocaleString();
            sub += t;
        });
        const d = document.getElementById('disc').value || 0;
        const p = document.getElementById('paid').value || 0;
        const total = (sub - (sub * d / 100)) - p;
        document.getElementById('sub-view').innerText = sub.toLocaleString();
        document.getElementById('bal-view').innerText = total.toLocaleString();
    }

    function addRow() {
        const tr = document.getElementById('rows').insertRow();
        tr.innerHTML = `<td><input placeholder="Enter item..." style="border:none; width:100%; background:transparent;" class="p-desc"></td><td><input type="number" value="1" class="p-qty" oninput="doCalc()"></td><td><input type="number" value="0" class="p-rate" oninput="doCalc()"></td><td style="text-align:right; font-weight:800;" class="p-total">0</td>`;
    }

    // --- Signature ---
    let pCan, pCtx, drawing = false;
    function initSignature() {
        pCan = document.getElementById('sig-pad');
        if (!pCan) return;
        pCtx = pCan.getContext('2d');
        pCan.width = pCan.offsetWidth; pCan.height = 140;
        pCtx.lineWidth = 2.5; pCtx.strokeStyle = "#000"; pCtx.lineCap = 'round';
        const getXY = (e) => {
            const r = pCan.getBoundingClientRect();
            return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top };
        };
        pCan.addEventListener('touchstart', (e)=>{drawing=true; const p=getXY(e); pCtx.beginPath(); pCtx.moveTo(p.x, p.y); e.preventDefault();});
        pCan.addEventListener('touchmove', (e)=>{if(!drawing) return; const p=getXY(e); pCtx.lineTo(p.x, p.y); pCtx.stroke(); e.preventDefault();});
        window.addEventListener('touchend', ()=>drawing=false);
    }
    function clearSig() { pCtx.clearRect(0,0,pCan.width,pCan.height); }

    // --- FULL PDF SNAPSHOT ENGINE ---
    async function saveFullPDF() {
        document.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
        const bill = document.getElementById('bill-ui');
        window.scrollTo(0,0);
        
        const canvas = await html2canvas(bill, {
            scale: 2,
            useCORS: true,
            height: bill.scrollHeight,
            windowHeight: bill.scrollHeight,
            scrollY: -window.scrollY
        });

        const img = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        const pdfW = 210;
        const pdfH = (canvas.height * pdfW) / canvas.width;
        pdf.addImage(img, 'PNG', 0, 0, pdfW, pdfH);
        pdf.save('Naveed_Textiles_Invoice.pdf');
    }
</script>
</body>
</html>
